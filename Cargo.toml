[workspace]
resolver = "2"
members = ["crates/story-core", "crates/story-storage", "crates/story-app", "crates/story-import", "apps/cli"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
uuid = { version = "1.18", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
thiserror = "2.0"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
tempfile = "3.23"
