[workspace]
resolver = "2"
members = ["crates/story-core", "crates/story-storage", "crates/story-app", "crates/story-import", "crates/story-reading", "crates/story-analysis", "crates/story-ollama", "crates/story-pipeline", "crates/story-document", "crates/story-git", "crates/story-web", "apps/cli", "apps/terminal"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
uuid = { version = "1.18", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
thiserror = "2.0"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
tempfile = "3.23"
ratatui = "0.29"
crossterm = "0.28"
serde_json = "1.0"
zip = "0.6.6"
time = { version = "0.3.47", features = ["parsing"] }
unicode-segmentation = "1.12"
regex = "1.12"
pulldown-cmark = "0.9.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
