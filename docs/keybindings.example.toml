# Writer's IDE keybinding override example.
# Copy this file to:
#   $XDG_CONFIG_HOME/writers-ide/keybindings.toml
# or to a project's .writers-ide/keybindings.toml
#
# Set this to "standard", "word-star", or "custom". Standard is the default;
# WordStar supplies non-conflicting cursor and block-editing conventions;
# global shortcuts such as Ctrl+S Save and Ctrl+X Cut keep precedence. Custom
# keeps Standard behaviour and applies these user/project overrides.
profile = "standard"

[bindings]
# Function-key workspace navigation; unspecified workspace keys keep defaults.
F1 = "Analytics"
F4 = "Reading"

[commands]
# Direct aliases for top-level menus. Ctrl+/ and F10 remain the menu fallback.
"Alt+F" = "menu.file"
"Alt+E" = "menu.edit"
"Alt+I" = "menu.insert"

# Commands can be reassigned by stable registry ID. Add more entries as needed.
"Ctrl+Alt+S" = "file.save"
"Ctrl+Alt+F" = "search.find-panel"
"Ctrl+Alt+P" = "command.palette-open"

[contexts.editor]
# Commas separate sequential chords; plus signs combine simultaneous keys.
"Ctrl+X, Ctrl+S" = "file.save"

[contexts.navigation]
"Ctrl+X, Ctrl+F" = "file.open-project"

[contexts.menu]
# The same key may be used in distinct contexts when sequences do not conflict.
"Ctrl+X, Ctrl+H" = "help.context"
